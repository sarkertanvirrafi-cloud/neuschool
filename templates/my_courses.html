{% extends 'base.html' %}
{% block title %}NeuSchool | My Courses{% endblock %}
{% block content %}
<section class="page-hero reveal"><div class="page-title"><h1>MY COURSES</h1></div></section>
<section class="page-content reveal"><div class="course-grid">
{% for enrollment in enrollments %}

</div></section>
{% endblock %}
